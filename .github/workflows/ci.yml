name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project and development dependencies
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest -q
      - name: Compile Python modules
        run: uv run python -m compileall -q src
